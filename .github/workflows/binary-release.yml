name: Publish release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install frontend dependencies
        run: npm --prefix ./web ci

      - name: Build frontend
        run: npm --prefix ./web run build

      - name: Build binary package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_name="cpa-usage-keeper_${VERSION}_linux_amd64"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}/data"

          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=gcc \
            go build -trimpath -ldflags="-s -w -X cpa-usage-keeper/internal/version.Version=${VERSION}" -o "${package_dir}/cpa-usage-keeper" ./cmd/server/main.go
          cp .env.example README.md README.zh.md LICENSE "${package_dir}/"
          cp deploy/linux/cpa-usage-keeper.service "${package_dir}/"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          asset="dist/cpa-usage-keeper_${{ github.ref_name }}_linux_amd64.tar.gz"
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${asset}" --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              "${asset}"
          fi
